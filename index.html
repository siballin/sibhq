<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>sibhq</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: cable-guide shell — channel rail on the left (strip on phones), guide grid + tiles in the main pane. */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#E2E5EC; --ink:#11131A; --ink-2:#4B5165; --ink-3:#7A8094; --line:#D3D7E1;
  --ch-sports:#D9480F; --ch-betting:#2B8A3E; --ch-hiphop:#A07800; --ch-kpop:#C2255C; --ch-movies:#364FC7; --ch-anime:#6741D9; --ch-games:#0B7285;
  --good:#2B8A3E; --bad:#C92A2A; --warn:#B35C00;
  --scrim:rgba(17,19,26,.45); --shadow:0 10px 30px rgba(17,19,26,.14);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0E13; --surface:#151821; --surface-2:#1D212C; --ink:#ECEEF4; --ink-2:#A2A8BB; --ink-3:#6E7488; --line:#2A2F3B;
  --ch-sports:#FF7A3D; --ch-betting:#51CF66; --ch-hiphop:#FCC419; --ch-kpop:#F06595; --ch-movies:#748FFC; --ch-anime:#9775FA; --ch-games:#3BC9DB;
  --good:#51CF66; --bad:#FF6B6B; --warn:#FFA94D; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E13; --surface:#151821; --surface-2:#1D212C; --ink:#ECEEF4; --ink-2:#A2A8BB; --ink-3:#6E7488; --line:#2A2F3B;
  --ch-sports:#FF7A3D; --ch-betting:#51CF66; --ch-hiphop:#FCC419; --ch-kpop:#F06595; --ch-movies:#748FFC; --ch-anime:#9775FA; --ch-games:#3BC9DB;
  --good:#51CF66; --bad:#FF6B6B; --warn:#FFA94D; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;flex:none}
.brand b{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand .bars{display:inline-flex;gap:2px;height:18px;align-self:center}
.brand .bars i{width:5px;border-radius:1px}
.search{flex:1;min-width:0;position:relative;max-width:560px}
.search input{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px 0 34px}
.search svg{position:absolute;left:10px;top:11px;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);flex:none;text-align:right;line-height:1.25}
.sync{font-size:11px;color:var(--ink-3)}
.sync.on{color:var(--good)}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0}
.rail{position:sticky;top:calc(59px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 59px);overflow:auto;border-right:1px solid var(--line);padding:14px 10px 30px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.rail .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px;font-weight:600}
.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a[aria-current]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.chno{font-family:var(--f-display);font-weight:800;font-size:15px;width:30px;height:22px;display:grid;place-items:center;border-radius:4px;color:#fff;background:var(--c,var(--ink-2));flex:none;letter-spacing:.02em}
.rail .ico{width:30px;display:grid;place-items:center;flex:none}
.rail .ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}

main{min-width:0;padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* page head */
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.phead .t{display:flex;align-items:center;gap:12px}
.phead .chno{width:auto;padding:0 8px;height:30px;font-size:19px}
.phead h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,5vw,52px);line-height:.95;text-transform:uppercase;letter-spacing:.005em}
.phead p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.ch{background:var(--c);border-color:var(--c);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:wait}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2,.sh{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:10px;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2)}
.tag.c{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.empty{padding:22px;text-align:center;color:var(--ink-3);font-size:14px;border:1px dashed var(--line);border-radius:10px}

/* banner */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.banner b{font-weight:700}
.banner .sp{flex:1;min-width:200px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tile .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c)}
.tile .v{font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--ink-2)}
.tile .row{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:6px;flex-wrap:wrap}

.tonight{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-radius:14px;background:var(--ink);color:var(--bg)}
.tonight h2{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:30px;line-height:1}
.tonight p{margin:4px 0 0;opacity:.75;font-size:14px}
.tonight .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.pick{display:flex;gap:14px;align-items:center;margin-top:12px;grid-column:1/-1;background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:10px;padding:12px}
.pick .cover{width:56px;flex:none}

/* guide grid */
.guide{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.guide table{border-collapse:collapse;width:100%;min-width:720px}
.guide th,.guide td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;font-size:14px}
.guide thead th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);font-weight:700}
.guide tbody tr:last-child td,.guide tbody tr:last-child th{border-bottom:0}
.guide tbody th{width:150px;white-space:nowrap}
.guide tbody th a{display:flex;gap:8px;align-items:center;text-decoration:none;font-weight:700}
.guide td{border-left:1px solid var(--line)}
.slot b{display:block;font-weight:600;line-height:1.3}
.slot span{font-size:12px;color:var(--ink-3)}
.guide td.now{background:color-mix(in srgb,var(--c) 7%,transparent)}

/* lists & cards */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600;overflow-wrap:anywhere}
.li .main span{font-size:13px;color:var(--ink-2)}
.li .end{display:flex;gap:6px;align-items:center;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;cursor:pointer;background:none;border:0;padding:0;text-align:left;min-width:0}
.card .meta{font-size:12px;color:var(--ink-2)}
.card b{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.cover{aspect-ratio:2/3;max-width:100%;border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;
  background:linear-gradient(165deg,hsl(var(--h) 52% 46%),hsl(calc(var(--h) + 50) 58% 18%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);pointer-events:none}
.cover .ct{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:20px;line-height:.95;text-shadow:0 1px 8px rgba(0,0,0,.35);overflow-wrap:anywhere}
.cover .cy{font-family:var(--f-mono);font-size:11px;opacity:.8;margin-top:4px}
.cover.sq{aspect-ratio:1}
.cover.wide{aspect-ratio:16/9}
.cover .badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);border-radius:4px;padding:2px 6px;font-family:var(--f-mono);font-size:12px;font-weight:600}

.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:9px 12px;background:var(--surface-2);font-weight:700;white-space:nowrap}
table.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr.sub td{background:var(--bg)}

/* chart */
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-family:var(--f-mono);font-size:11px}
.chart .zero{stroke:var(--ink-3);stroke-dasharray:3 3}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .dow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:8px;background:var(--surface-2);font-weight:700}
.cal .day{min-height:104px;padding:6px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:none;text-align:left;border-right:0;border-bottom:0;font-size:inherit}
.cal .day:nth-child(7n+1){border-left:0}
.cal .day.out{opacity:.4}
.cal .day .dn{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.cal .day.today .dn{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 5px;align-self:flex-start}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.ev{font-size:12px;line-height:1.25;padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--ink-3)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:220px;min-width:0}
.wcol h3{font-size:13px;font-weight:700}
.wcol.today{border-color:var(--ink)}
.agenda .ad{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:20px;padding:14px 14px 4px}
.cd{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,calc(env(safe-area-inset-top,0px) + 12px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);box-shadow:var(--shadow);border:1px solid var(--line)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal header h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:24px;flex:1;line-height:1}
.modal .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .l{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 10px;width:100%;min-width:0}
.fld textarea{height:auto;min-height:90px;padding:8px 10px;font-family:var(--f-mono);font-size:13px;line-height:1.5}
.fld .hint{font-size:12px;color:var(--ink-3)}
.fld.cb{flex-direction:row;align-items:center;gap:8px}
.fld.cb input{width:18px;height:18px}
.ask{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);flex-wrap:wrap;font-size:13px}
.ask .sp{flex:1;min-width:160px;color:var(--ink-2)}
.err{color:var(--bad);font-size:13px}

/* search overlay */
.sres{position:absolute;left:0;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:70vh;overflow:auto;z-index:40}
.sres .grp{padding:8px 12px 2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c)}
.sres button.hit{display:flex;width:100%;gap:10px;align-items:center;padding:8px 12px;background:none;border:0;text-align:left;cursor:pointer}
.sres button.hit:hover,.sres button.hit:focus-visible{background:var(--surface-2)}
.sres .hit span{font-size:12px;color:var(--ink-3)}

/* kpop profile */
.prof{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 18px;margin-top:10px}
.facts div span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.facts div b{font-weight:600}
.trk{display:flex;flex-wrap:wrap;gap:6px}
.trk button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer}
.trk button[aria-pressed="true"]{border-color:var(--c);color:var(--c);font-weight:600}
.star{color:var(--c)}


.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ncard{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;min-width:0}
.ncard:hover{border-color:var(--ink-3)}
.ncard.mine{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.nrow{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink-2)}
.nrow img{flex:none;object-fit:contain}
.nrow b{width:40px;flex:none;color:var(--ink)}
.nrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .sc{font-size:18px;font-weight:600;width:40px;text-align:right;flex:none}
.nrow.win .sc,.nrow.win b{color:var(--ink);font-weight:700}
.nst{padding-top:4px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink-3)}

@media (max-width:900px){
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shell{grid-template-columns:minmax(0,1fr)}

/* ================= sync (db per-person, private) ================= */

function setSync(t,on){const el=$('#sync');el.textContent=t;el.classList.toggle('on',!!on)}
function save(...keys){
  saveLocal();
  if(!sync.db||!sync.uid)return;
  for(const k of keys){clearTimeout(sync.timers[k]);sync.timers[k]=setTimeout(()=>flush(k),600)}
}
async function flush(k){
  if(sync.writing[k]){sync.queued[k]=true;return}
  sync.writing[k]=true;setSync('Syncing…');
  try{await sync.db.doc(`data/users/${sync.uid}/${k}`).set({v:JSON.stringify(S[k]),at:Date.now()});setSync('Synced to your account',true)}
  catch(e){setSync('Sync failed — saved on this device')}
  finally{sync.writing[k]=false;if(sync.queued[k]){sync.queued[k]=false;flush(k)}}
}
async function initCaps(){
  if(!window.claude||!window.claude.use)return;
  claude.use('sample').then(s=>{sync.sample=s;if(s)render()}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    sync.db=db;sync.uid=id;setSync('Connecting…');
    const timer=setTimeout(()=>setSync('Account sync unreachable — saved on this device'),10000);
    const keys=[...KEYS,'meta'];
    const snaps=await Promise.all(keys.map(k=>db.doc(`data/users/${id}/${k}`).get().catch(()=>null)));
    clearTimeout(timer);
    const any=snaps.some(s=>s&&s.exists);
    if(any){keys.forEach((k,i)=>{const s=snaps[i];if(s&&s.exists){try{S[k]=JSON.parse(s.data().v)}catch(e){}}});saveLocal();render()}
    else if(!S.meta.examples){keys.forEach(k=>flush(k))}
    setSync('Synced to your account',true);
    keys.forEach(k=>db.doc(`data/users/${id}/${k}`).onSnapshot(snap=>{
      if(!snap.exists||snap.metadata?.hasPendingWrites||sync.timers[k]&&sync.writing[k])return;
      try{const v=JSON.parse(snap.data().v);if(JSON.stringify(v)!==JSON.stringify(S[k])){S[k]=v;saveLocal();render()}}catch(e){}
    },()=>setSync('Sync paused — saved on this device')));
  }catch(e){}
}

function allEvents(from,to){
  const out=[];const inR=s=>{const d=parseD(s);return d&&d>=from&&d<=to};
  sportsGames().forEach(g=>{if(inR(g.date))out.push({date:g.date.slice(0,10),time:g.date,ch:'sports',title:`${g.away} @ ${g.home}`,sub:g.status==='final'?`Final ${g.awayScore}–${g.homeScore}`:`${g.league} · ${fmtT(g.date)}`,mine:isFollowedTeam(g)})});

  S.kpop.groups.forEach(g=>{
    (g.comebacks||[]).forEach(c=>{if(inR(c.date))out.push({date:c.date,ch:'kpop',title:`${g.name}: ${c.title}`,sub:c.kind})});
    if(g.followed){(g.members||[]).forEach(m=>{const b=parseD(m.birthday);if(!b)return;for(let y=from.getFullYear();y<=to.getFullYear();y++){const d=new Date(y,b.getMonth(),b.getDate());if(d>=from&&d<=to)out.push({date:iso(d),ch:'kpop',title:`${m.stage}’s birthday (${g.name})`,sub:`Turns ${y-b.getFullYear()}`})}});

/* ================= ESPN NBA feed ================= */
const ESPN_HOSTS=['https://site.api.espn.com','https://site.web.api.espn.com'];
const NBA_PATH='/apis/site/v2/sports/basketball/nba';
const NBA={teams:null,days:{},sched:{},err:'',sel:iso(today()),busy:{},tried:{}};
async function espn(path){let last;for(const h of ESPN_HOSTS){try{const r=await fetch(h+path,{cache:'no-store'});if(r.ok)return await r.json();last=new Error('HTTP '+r.status)}catch(e){last=e}}throw last||new Error('unreachable')}
const scoreOf=x=>x==null?'':typeof x==='object'?(x.displayValue??x.value??''):x;
function normEvent(ev){const c=(ev.competitions||[])[0]||{};const st=((ev.status||c.status)||{}).type||{};
  const comp=(c.competitors||[]).map(x=>({ha:x.homeAway,id:x.team?.id,abbr:x.team?.abbreviation||'',name:x.team?.displayName||'',logo:x.team?.logo||x.team?.logos?.[0]?.href||'',score:scoreOf(x.score),rec:((x.records||x.record||[])[0]||{}).summary||'',winner:!!x.winner}));
  const tv=[...new Set([...(c.broadcasts||[]).flatMap(b=>b.names||[]),...(c.broadcasts||[]).map(b=>b.media?.shortName).filter(Boolean),...(c.geoBroadcasts||[]).map(g=>g.media?.shortName).filter(Boolean)])].join(', ');
  return {id:ev.id,date:ev.date,state:st.state||'pre',completed:!!st.completed,detail:st.shortDetail||st.detail||'',home:comp.find(x=>x.ha==='home')||{},away:comp.find(x=>x.ha==='away')||{},tv,venue:c.venue?.fullName||''}}
const localDT=s=>{const d=new Date(s);return iso(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
let nbaTeamsP=null;
function nbaTeams(){if(NBA.teams)return Promise.resolve(NBA.teams);return nbaTeamsP=nbaTeamsP||nbaTeamsLoad().catch(e=>{nbaTeamsP=null;throw e})}
async function nbaTeamsLoad(){const j=await espn(NBA_PATH+'/teams');
  NBA.teams=((j.sports||[])[0]?.leagues?.[0]?.teams||[]).map(x=>x.team).filter(Boolean).map(t=>({id:t.id,abbr:t.abbreviation,name:t.displayName,short:t.shortDisplayName,nick:t.name,logo:t.logos?.[0]?.href||''}));return NBA.teams}
const matchTeam=name=>{const n=String(name||'').toLowerCase().trim();return (NBA.teams||[]).find(t=>[t.name,t.short,t.abbr,t.nick].some(v=>v&&v.toLowerCase()===n))||(NBA.teams||[]).find(t=>n&&(t.name.toLowerCase().includes(n)||(t.nick&&n.includes(t.nick.toLowerCase()))))};
async function loadDay(d,quiet){if(NBA.busy[d])return;NBA.busy[d]=true;if(!quiet)render();
  try{const j=await espn(`${NBA_PATH}/scoreboard?dates=${d.replace(/-/g,'')}`);NBA.days[d]=(j.events||[]).map(normEvent);NBA.err=''}
  catch(e){NBA.err='Couldn’t reach ESPN right now. Your other data is fine — try again in a minute.'}
  NBA.busy[d]=false;render()}
async function loadTeamScheds(){
  const mine=S.sports.teams.filter(t=>t.league==='NBA');if(!mine.length)return;
  try{await nbaTeams()}catch(e){NBA.err='Couldn’t reach ESPN right now.';render();return}
  await Promise.all(mine.map(async t=>{const m=matchTeam(t.name);if(!m){NBA.sched[t.name]=null;return}
    try{const j=await espn(`${NBA_PATH}/teams/${m.id}/schedule?seasontype=2`);NBA.sched[t.name]={team:m,events:(j.events||[]).map(normEvent)}}catch(e){}}));
  render()}
function sportsGames(){
  const out=[];const seen=new Set();
  Object.entries(NBA.sched).forEach(([,v])=>{if(!v)return;v.events.forEach(e=>{if(seen.has(e.id))return;seen.add(e.id);
    const fin=e.state==='post';out.push({id:'espn-'+e.id,espn:true,espnId:e.id,league:'NBA',home:e.home.name,away:e.away.name,date:localDT(e.date),status:fin?'final':'scheduled',live:e.state==='in',homeScore:fin?Number(e.home.score):null,awayScore:fin?Number(e.away.score):null})})});
  const covered=new Set(Object.values(NBA.sched).filter(Boolean).map(v=>v.team.name));
  S.sports.games.forEach(g=>{if(g.league==='NBA'&&covered.size&&[g.home,g.away].some(n=>covered.has(matchTeam(n)?.name)))return;out.push(g)});
  return out;
}
function nbaSection(){
  const sel=NBA.sel;const evs=NBA.days[sel];
  if(!evs&&!NBA.busy[sel]&&!NBA.tried[sel]){NBA.tried[sel]=true;setTimeout(()=>loadDay(sel),0)}
  const myNames=S.sports.teams.filter(t=>t.league==='NBA').map(t=>matchTeam(t.name)?.name||t.name);
  const strip=[-1,0,1,2,3,4,5,6].map(n=>{const d=D(n);const lbl=n===-1?'Yesterday':n===0?'Today':n===1?'Tomorrow':parseD(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric'});return `<button class="chip" aria-pressed="${sel===d}" data-act="nbaDay" data-d="${d}">${lbl}</button>`}).join('');

  const card=e=>{const mine=myNames.includes(e.home.name)||myNames.includes(e.away.name);const show=e.state!=='pre';
    const status=e.state==='in'?`<span class="tag c" style="--c:var(--bad)">Live</span> ${esc(e.detail)}`:e.state==='post'?esc(e.detail||'Final'):`${new Date(e.date).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}${e.tv?' · '+esc(e.tv):''}`;
    return `<a class="ncard ${mine?'mine':''}" href="https://www.espn.com/nba/game/_/gameId/${esc(e.id)}" target="_blank" rel="noopener">${side(e.away,show)}${side(e.home,show)}<div class="small muted nst">${status}${mine?' · ★ your team':''}</div></a>`};
  const list=evs?(evs.length?`<div class="ngrid">${[...evs].sort((a,b)=>(myNames.includes(b.home.name)||myNames.includes(b.away.name))-(myNames.includes(a.home.name)||myNames.includes(a.away.name))||a.date.localeCompare(b.date)).map(card).join('')}</div>`:'<div class="empty">No NBA games on this day.</div>'):(NBA.err?'':'<div class="empty">Loading the NBA schedule…</div>');
  return `<section class="sec" style="--c:${cvar('sports')}"><h2>NBA schedule <span style="text-transform:none;letter-spacing:0;font-weight:500" class="faint">live from ESPN${evs&&evs.some(e=>e.state==='in')?' · updating every 30s':''}</span></h2>
    <div class="chips">${strip}<button class="chip" data-act="nbaRefresh">↻ Refresh</button></div>${NBA.err?`<div class="err">${esc(NBA.err)}</div>`:''}${list}</section>`;
}

function pickTonight(){

  S.movies.items.filter(m=>m.status==='watchlist'&&(!m.release||diffDays(m.release)<=0)).forEach(m=>pool.push({ch:'movies',title:m.title,sub:m.year,why:`From your watchlist${m.runtime?` · ${m.runtime} min`:''}`}));
  S.anime.items.filter(a=>a.status==='watching'||a.status==='plan').forEach(a=>{const left=(a.episodes||0)-(a.watched||0);pool.push({ch:'anime',title:a.title,sub:`Ep ${a.watched+1}`,why:a.status==='plan'?'Start something new':`Pick up at episode ${a.watched+1}${left>0?` · ${left} left`:''}`})});
  S.games.items.filter(g=>g.status==='playing'||g.status==='backlog').forEach(g=>pool.push({ch:'games',title:g.title,sub:g.platform,why:g.status==='playing'?`Keep going — ${g.completion||0}% done`:'Pulled from your backlog'}));
  S.hiphop.releases.filter(r=>r.status==='queued'&&(!r.date||diffDays(r.date)<=0)).forEach(r=>pool.push({ch:'hiphop',title:r.title,sub:r.artist,why:`${r.type} by ${r.artist}, queued to listen`}));
  if(!pool.length){toast('Add something to a watchlist or backlog first');return}
  let p;do{p=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&UI.tonight&&p.title===UI.tonight.title);
  UI.tonight=p;render();
}

  </tbody></table></div></section>

function lineChart(pts,k){
  if(pts.length<2)return '<div class="empty">Settle at least two bets to draw the curve.</div>';
  const W=760,H=240,pl=56,pr=12,pt=12,pb=28;
  const vs=pts.map(p=>p.v);let lo=Math.min(0,...vs),hi=Math.max(0,...vs);
  const step=nice((hi-lo)/4);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g='';for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v<0?'−':''}$${Math.abs(v)}</text>`;
  const ticks=[0,Math.floor((pts.length-1)/2),pts.length-1].map(i=>`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${fmtD(pts[i].d)}</text>`).join('');
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=`${line}L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative profit ${money(last.v)}">${g}<line class="zero" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>
  <path d="${area}" fill="${cvar(k)}" fill-opacity=".12"/><path d="${line}" fill="none" stroke="${cvar(k)}" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="${x(pts.length-1)}" cy="${y(last.v)}" r="5" fill="${cvar(k)}" stroke="var(--surface)" stroke-width="2"/>${ticks}</svg>`;
}
function nice(r){if(r<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function spark(vals){const W=70,H=20,lo=Math.min(...vals),hi=Math.max(...vals),r=hi-lo||1;return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="Line movement ${vals.map(fmtOdds).join(' to ')}" style="display:block"><path d="${vals.map((v,i)=>`${i?'L':'M'}${(i*(W-4)/(vals.length-1)+2).toFixed(1)},${(H-2-(v-lo)/r*(H-4)).toFixed(1)}`).join('')}" fill="none" stroke="${cvar('betting')}" stroke-width="1.6"/></svg>`}

function vMovies(){
  const M=S.movies.items;const tab=UI.movieTab;
  let items=tab==='watchlist'?M.filter(m=>m.status==='watchlist'):tab==='watched'?M.filter(m=>m.status==='watched').sort((a,b)=>String(b.watched||'').localeCompare(String(a.watched||''))):M.filter(m=>m.status==='watched').sort((a,b)=>(a.rank||999)-(b.rank||999)||(b.rating||0)-(a.rating||0));
  const watched=M.filter(m=>m.status==='watched'&&m.rating);
  const avgMe=watched.length?watched.reduce((s,m)=>s+Number(m.rating),0)/watched.length:0;
  const withAud=watched.filter(m=>m.audience);const diff=withAud.length?withAud.reduce((s,m)=>s+(m.rating-m.audience),0)/withAud.length:0;
  const body=tab==='ranked'?(items.length?`<div class="panel list">${items.map((m,n)=>`<div class="li"><span class="num" style="font-weight:600;width:24px">${n+1}</span><div style="width:40px;flex:none">${cover(m.title,'')}</div><div class="main"><b>${esc(m.title)} <span class="faint">${m.year||''}</span></b><span>You ${m.rating??'—'}/10 · Audience ${m.audience??'—'}/10</span></div><div class="end"><button class="btn sm ghost" data-act="mrank" data-id="${m.id}" data-d="-1" ${n===0?'disabled':''} aria-label="Move up">▲</button><button class="btn sm ghost" data-act="mrank" data-id="${m.id}" data-d="1" ${n===items.length-1?'disabled':''} aria-label="Move down">▼</button></div></div>`).join('')}</div>`:'<div class="empty">Rate movies you’ve watched to rank them.</div>')
   :(items.length?`<div class="cards">${items.map(m=>`<button class="card" data-act="edit" data-type="movie" data-id="${m.id}">${cover(m.title,m.year,'',m.rating?m.rating+'/10':m.release&&diffDays(m.release)>0?rel(m.release):'')}<b>${esc(m.title)}</b><span class="meta">${list(m.genres).join(', ')}${m.rewatches?` · rewatched ×${m.rewatches}`:''}</span>${m.status==='watched'&&m.rating&&m.audience?`<span class="meta">You <b class="num">${m.rating}</b> vs audience <b class="num">${m.audience}</b> <span class="${m.rating>=m.audience?'pos':'neg'}">(${sgn(m.rating-m.audience)})</span></span>`:''}</button>`).join('')}</div>`:`<div class="empty">${tab==='watchlist'?'Your watchlist is empty.':'Nothing watched yet.'}</div>`);

  <div class="stats"><div class="stat"><div class="k">Watched</div><div class="v">${M.filter(m=>m.status==='watched').length}</div></div><div class="stat"><div class="k">Watchlist</div><div class="v">${M.filter(m=>m.status==='watchlist').length}</div></div><div class="stat"><div class="k">Your average</div><div class="v">${avgMe.toFixed(1)}</div></div><div class="stat"><div class="k">You vs audience</div><div class="v ${diff>=0?'pos':'neg'}">${sgn(diff)}</div></div></div>
  <div class="chips">${[['watchlist','Watchlist'],['watched','Watched'],['ranked','Ranked list']].map(([k,l])=>`<button class="chip" aria-pressed="${tab===k}" data-act="movieTab" data-t="${k}">${l}</button>`).join('')}</div>
  ${body}`;
}

/* ---------- FOR YOU ---------- */
function vForYou(){
  const liked=[],cand=[];
  const add=(ch,arr,likedF,candF,titleF,genresF)=>arr.forEach(x=>{if(likedF(x))liked.push({ch,title:titleF(x),g:list(genresF(x))});if(candF(x))cand.push({ch,x,title:titleF(x),g:list(genresF(x))})});
  add('movies',S.movies.items,m=>m.rating>=8,m=>m.status==='watchlist',m=>m.title,m=>m.genres);
  add('anime',S.anime.items,a=>a.rating>=8,a=>a.status==='plan'||a.status==='watching',a=>a.title,a=>a.genres);
  add('games',S.games.items,g=>g.rating>=8,g=>g.status==='backlog'||g.status==='wishlist',g=>g.title,g=>g.genres);
  add('hiphop',S.hiphop.releases,r=>r.rating>=8,r=>r.status==='queued',r=>`${r.artist} — ${r.title}`,r=>r.genre);
  const scored=cand.map(c=>{let best=null,sc=0;liked.forEach(l=>{const o=c.g.filter(g=>l.g.map(s=>s.toLowerCase()).includes(g.toLowerCase())).length;if(o>sc){sc=o;best=l}});return {...c,sc,because:best}}).filter(c=>c.sc>0).sort((a,b)=>b.sc-a.sc);
  const r=UI.recs;
  return `${head('','For You','Picks from your own lists that match what you rated highly, plus new suggestions from Claude.','')}
  <section class="sec"><h2>From your lists</h2>${scored.length?`<div class="panel list">${scored.slice(0,10).map(c=>`<div class="li">${chno(c.ch)}<div class="main"><b>${esc(c.title)}</b><span>Because you liked ${esc(c.because.title)} · shares ${c.g.filter(g=>c.because.g.map(s=>s.toLowerCase()).includes(g.toLowerCase())).map(esc).join(', ')}</span></div><div class="end"><a class="btn sm ghost" href="#${c.ch}">Open</a></div></div>`).join('')}</div>`:'<div class="empty">Rate a few things 8 or higher and add genres to see matches from your watchlist and backlog.</div>'}</section>
  <section class="sec"><h2>Something new</h2>
    ${sync.sample?`<div class="ask"><span class="sp">Claude suggests titles you haven’t saved yet, based on what you rated highest.</span><button class="btn pri" data-act="recs" ${UI.recsBusy?'disabled':''}>${UI.recsBusy?'Thinking…':r?'Refresh picks':'Get picks'}</button></div>`:'<div class="empty">New suggestions from Claude appear here when this page is opened on claude.ai.</div>'}
    ${UI.recsErr?`<div class="err">${esc(UI.recsErr)}</div>`:''}
    ${r?`<div class="panel list">${r.map((x,i)=>`<div class="li">${chOf(x.channel)?chno(x.channel):''}<div class="main"><b>${esc(x.title)} ${x.year?`<span class="faint">${esc(x.year)}</span>`:''}</b><span>${esc(x.why)}</span></div><div class="end">${x.added?'<span class="tag">Added</span>':`<button class="btn sm" data-act="recAdd" data-i="${i}">Add to list</button>`}</div></div>`).join('')}</div><p class="small faint">${CAVEAT}</p>`:''}
  </section>`;
}

const fmtLines=(arr,cols)=>(arr||[]).map(o=>cols.map(c=>Array.isArray(o[c])?o[c].join('; '):(o[c]??'')).join(' | ')).join('\n');
const parseLines=(txt,cols,prev)=>String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const p=l.split('|').map(s=>s.trim());const o={};cols.forEach((c,j)=>o[c]=c==='tracks'?(p[j]||'').split(';').map(s=>s.trim()).filter(Boolean):(p[j]||''));
  if(cols.includes('tracks')){const old=(prev||[]).find(a=>a.title===o.title);o.rank=old?.rank||i+1;o.favs=(old?.favs||[]).filter(f=>o.tracks.includes(f))}return o});

let modalState=null;
function openForm(type,item,prefill){
  const spec=FORMS[type];const isNew=!item;const v={...(prefill||{}),...(item||{})};
  if(isNew){if(type==='bet'){v.date=v.date||D(0);v.result=v.result||'open';v.sport=v.sport||'NBA'}if(type==='event')v.date=v.date||UI.cal.sel;if(type==='game')v.status=v.status||'scheduled'}
  modalState={type,item,spec};
  const fld=f=>{const id='f-'+f.k;let val=v[f.k];
    if(f.type==='lines')val=fmtLines(val,f.cols);else if(Array.isArray(val))val=val.join(', ');
    let input;
    if(f.type==='select')input=`<select id="${id}" name="${f.k}">${f.opts.map((o,i)=>`<option value="${esc(o)}" ${String(val??'')===String(o)?'selected':''}>${esc(f.labels?f.labels[i]:o)}</option>`).join('')}</select>`;
    else if(f.type==='textarea'||f.type==='lines')input=`<textarea id="${id}" name="${f.k}" rows="${f.type==='lines'?5:4}">${esc(val)}</textarea>`;
    else if(f.type==='checkbox')return `<div class="fld cb ${f.full?'full':''}"><input id="${id}" type="checkbox" name="${f.k}" ${val?'checked':''}><label for="${id}">${esc(f.label)}</label></div>`;
    else input=`${f.dl&&NBA.teams?`<datalist id="${f.dl}">${NBA.teams.map(t=>`<option value="${esc(t.name)}">`).join('')}</datalist>`:''}<input id="${id}" name="${f.k}" type="${f.type}" value="${esc(val)}" ${f.dl?`list="${f.dl}"`:''} ${f.req?'required':''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.step?`step="${f.step}"`:f.type==='number'?'step="any"':''}>`;
    return `<div class="fld ${f.full?'full':''}"><label for="${id}">${esc(f.label)}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`};
  const lk=spec.lookup&&sync.sample?`<div class="ask"><span class="sp">Type a title above, then let Claude fill in the details.</span><button type="button" class="btn sm pri" data-act="lookup">Fill with Claude</button></div><div id="lkmsg" class="small faint"></div>`:'';
  $('#modal-root').innerHTML=`<div class="scrim" data-act="scrim"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-labelledby="mtitle" style="--c:${spec.ch?cvar(spec.ch):'var(--ink)'}">
    <header>${spec.ch?chno(spec.ch):''}<h2 id="mtitle">${isNew?'Add':'Edit'} ${esc(spec.title.toLowerCase())}</h2><button type="button" class="btn sm ghost" data-act="close" aria-label="Close">✕</button></header>
    <div class="body"><div class="form">${spec.fields.map(fld).join('')}</div>${lk}</div>
    <footer>${!isNew?`<button type="button" class="btn ghost l" data-act="delete" style="color:var(--bad)">Delete</button>`:''}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit">${isNew?'Add':'Save'}</button></footer></form></div>`;
  setTimeout(()=>$('#mform input,#mform select')?.focus(),30);
}
function closeModal(){$('#modal-root').innerHTML='';modalState=null}
function readForm(){
  const {spec,item}=modalState;const fd=$('#mform');const o={};
  spec.fields.forEach(f=>{const el=fd.elements[f.k];if(!el)return;
    if(f.type==='checkbox')o[f.k]=el.checked;
    else if(f.type==='number')o[f.k]=el.value===''?null:Number(el.value);
    else if(f.type==='lines')o[f.k]=parseLines(el.value,f.cols,item?.[f.k]);
    else if(['genres','cast','socials'].includes(f.k))o[f.k]=list(el.value);
    else if(f.k==='airDay')o[f.k]=el.value===''?'':Number(el.value);
    else o[f.k]=el.value.trim()});
  return o;
}
function submitForm(e){
  e.preventDefault();const {type,item}=modalState;const o=readForm();const arr=COLL[type]();
  if(type==='vgame'&&o.status==='done'&&!(item&&item.status==='done'))o.finished=D(0);
  if(type==='anime'&&o.status==='completed'&&!(item&&item.status==='completed'))o.finished=D(0);
  if(type==='movie'&&o.status==='watched'&&!o.watched)o.watched=D(0);
  if(type==='game'&&o.homeScore!=null&&o.awayScore!=null&&!(item&&item.status==='final'))o.status='final';
  if(item){Object.assign(item,o);delete item.ex}else{const n={id:uid(),...o};if(type==='bet')n.lines=[];if(type==='group'){n.followed=true;n.comebacks=n.comebacks||[]}arr.push(n)}
  closeModal();commit(COLLKEY[type]);toast(item?'Saved':'Added');
}
async function doLookup(btn){
  const {spec}=modalState;const fd=$('#mform');const key=fd.elements.title?'title':'name';
  const q=(fd.elements[key]?.value||'').trim()||(fd.elements.artist?.value||'').trim();
  const msg=$('#lkmsg');if(!q){msg.textContent='Type a title or name first.';return}
  btn.disabled=true;btn.textContent='Looking up…';msg.textContent='';
  try{const qq=spec.lookup==='release'&&fd.elements.artist?.value?`${fd.elements.artist.value} — ${fd.elements.title?.value||''}`:q;
    const r=await askJSON(LOOKUP[spec.lookup](qq));
    spec.fields.forEach(f=>{const el=fd.elements[f.k];if(!el||r[f.k]==null||r[f.k]==='')return;
      if(f.type==='lines')el.value=fmtLines(r[f.k],f.cols);else if(Array.isArray(r[f.k]))el.value=r[f.k].join(', ');else el.value=r[f.k]});
    msg.textContent='Filled in. '+CAVEAT;
  }catch(e){msg.innerHTML=`<span class="err">${esc(e.message)}</span>`}
  btn.disabled=false;btn.textContent='Fill with Claude';
}

/* ================= search ================= */
function searchIndex(){
  const ix=[];
  S.sports.teams.forEach(t=>ix.push({ch:'sports',t:t.name,s:t.league,type:'team',id:t.id}));
  S.sports.games.forEach(g=>ix.push({ch:'sports',t:`${g.away} @ ${g.home}`,s:`${g.league} · ${fmtD(g.date)}`,type:'game',id:g.id}));
  S.betting.bets.forEach(b=>ix.push({ch:'betting',t:b.desc,s:`${fmtOdds(b.odds)} · ${b.result}`,type:'bet',id:b.id}));
  S.hiphop.artists.forEach(a=>ix.push({ch:'hiphop',t:a.name,s:'Artist',type:'artist',id:a.id}));
  S.hiphop.releases.forEach(r=>ix.push({ch:'hiphop',t:`${r.title}`,s:r.artist,type:'release',id:r.id}));
  S.kpop.groups.forEach(g=>{ix.push({ch:'kpop',t:g.name,s:g.agency,type:'kgroup',id:g.id});(g.members||[]).forEach(m=>ix.push({ch:'kpop',t:m.stage,s:`${g.name}${m.real?' · '+m.real:''}`,type:'kgroup',id:g.id}));(g.albums||[]).forEach(a=>ix.push({ch:'kpop',t:a.title,s:`${g.name} · ${a.type}`,type:'kgroup',id:g.id}))});
  S.movies.items.forEach(m=>ix.push({ch:'movies',t:m.title,s:[m.year,m.director].filter(Boolean).join(' · ')+((m.cast||[]).length?' · '+list(m.cast).join(', '):''),type:'movie',id:m.id}));
  S.anime.items.forEach(a=>ix.push({ch:'anime',t:a.title,s:a.status,type:'anime',id:a.id}));
  S.games.items.forEach(g=>ix.push({ch:'games',t:g.title,s:g.platform,type:'vgame',id:g.id}));
  return ix;
}
let searchAI=null;
function renderSearch(){
  const q=$('#q').value.trim().toLowerCase();const box=$('#sres');
  if(!q){box.hidden=true;return}
  const hits=searchIndex().filter(h=>(h.t+' '+(h.s||'')).toLowerCase().includes(q)).slice(0,30);
  const groups={};hits.forEach(h=>(groups[h.ch]=groups[h.ch]||[]).push(h));
  let html=CH.filter(c=>groups[c.key]).map(c=>`<div class="grp" style="--c:${cvar(c.key)}">${c.name}</div>${groups[c.key].map(h=>`<button class="hit" data-act="openHit" data-type="${h.type}" data-id="${h.id}" data-ch="${h.ch}">${chno(h.ch)}<div style="min-width:0"><div>${esc(h.t)}</div><span>${esc(h.s||'')}</span></div></button>`).join('')}`).join('');
  if(!hits.length)html=`<div class="pad small faint">Nothing saved matches “${esc(q)}”.</div>`;
  if(sync.sample){
    if(searchAI&&searchAI.q===q){const r=searchAI.r;html+=searchAI.err?`<div class="pad err">${esc(searchAI.err)}</div>`:r?`<div class="grp" style="--c:var(--ink-2)">From Claude</div><div class="pad small" style="padding-top:4px"><b>${esc(r.title)}</b> — ${esc(r.summary)}${chOf(r.channel)&&r.channel!=='sports'?`<div style="margin-top:8px"><button class="btn sm pri" data-act="aiSave">Save to ${esc(chOf(r.channel).name)}</button></div>`:''}</div>`:`<div class="pad small faint">Asking Claude…</div>`}
    else html+=`<div style="padding:8px 12px;border-top:1px solid var(--line)"><button class="btn sm" data-act="aiSearch">Ask Claude about “${esc(q)}”</button></div>`;
  }
  box.innerHTML=html;box.hidden=false;
}

  if(k==='unit'){S.betting.unit=Math.max(1,Number(t.value)||25);commit('betting')}
  if(k==='oddsBook'){UI.odds[Number(t.dataset.i)].book=t.value}
  if(k==='oddsVal'){UI.odds[Number(t.dataset.i)].odds=t.value===''?'':Number(t.value);render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalState)closeModal();else{$('#sres').hidden=true}}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
$('#q').addEventListener('input',()=>{searchAI=null;renderSearch()});
$('#q').addEventListener('focus',renderSearch);
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sres').hidden=true},true);

function tick(){const n=new Date();$('#clk').textContent=n.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+' · '+n.toLocaleDateString(undefined,{weekday:'short'})}
tick();setInterval(tick,30000);
render();initCaps();loadTeamScheds();nbaTeams().catch(()=>{});
</script>
